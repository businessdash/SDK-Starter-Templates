<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Your Business — built on BD</title>
		<meta
			name="description"
			content="HTMX starter showing how to consume the BD SDK server-side and stream HTML fragments per section."
		/>
		<link rel="stylesheet" href="/styles.css" />
		<!-- SDK forms stylesheet (file-upload box, multi-step header, choice chips).
		     Served by the Bun server from node_modules; see server.ts → serveFormsCss. -->
		<link rel="stylesheet" href="/bd-forms.css" />
		<link rel="stylesheet" href="/forms.css" />
		<link rel="stylesheet" href="/tailwind.css" /><!-- [bd-line:tailwind] -->
		<!-- HTMX from a CDN; pin the version in production. -->
		<script
			src="https://unpkg.com/htmx.org@2.0.4"
			integrity="sha384-HGfztofotfshcF7+8n44JQL2oJmowVChPTg48S+jvZoztPfvwD79OC/LTtG6dMp+"
			crossorigin="anonymous"
		></script>
		<!-- htmx's morph swap: the contact form, re-rendered while you type, keeps
		     what's in the box you're in. -->
		<script
			src="https://unpkg.com/idiomorph@0.7.4/dist/idiomorph-ext.min.js"
			integrity="sha384-SsScJKzATF/w6suEEdLbgYGsYFLzeKfOA6PY+/C5ZPxOSuA+ARquqtz/BZz9JWU8"
			crossorigin="anonymous"
		></script>
	</head>
	<body>
		<!--
			Every visible region is a thin HTMX placeholder that fetches
			its own HTML fragment on body load. `hx-trigger="load"` fires
			the GET as soon as the element is parsed; `hx-swap="outerHTML"`
			replaces the placeholder with the server's HTML, so the final
			DOM has no wrapper noise.
		-->
		<div hx-get="/sections/banner" hx-trigger="load" hx-swap="outerHTML"></div>
		<div hx-get="/sections/header" hx-trigger="load" hx-swap="outerHTML"></div>
		<main>
			<div hx-get="/sections/hero" hx-trigger="load" hx-swap="outerHTML"></div>
			<div hx-get="/sections/about" hx-trigger="load" hx-swap="outerHTML"></div>
			<div hx-get="/sections/services" hx-trigger="load" hx-swap="outerHTML"></div>
			<!-- [bd:blog] -->
			<div hx-get="/sections/blog" hx-trigger="load" hx-swap="outerHTML"></div>
			<!-- [/bd:blog] -->
			<!-- Contact form: a BusinessDash form rendered on the server (src/form.ts),
			     the same engine as the SDK's <bd-form>: conditions, steps and checks
			     run on each post, and the key never leaves the server. -->
			<div hx-get="/sections/contact" hx-trigger="load" hx-swap="outerHTML"></div>
		</main>
		<div hx-get="/sections/footer" hx-trigger="load" hx-swap="outerHTML"></div>
		<!-- BD analytics. Config is injected by the Bun server (see
		     server.ts → injectAnalyticsConfig) as `window.__BD_ANALYTICS__`
		     so the public key never lives in this static file. -->
		<script type="module">
			const cfg = window.__BD_ANALYTICS__;
			if (cfg && cfg.siteId && cfg.baseUrl && cfg.apiKey) {
				const { initBdAnalytics } = await import(
					"https://esm.sh/@businessdash/sdk@0.9.97/analytics-core"
				);
				initBdAnalytics({
					siteId: cfg.siteId,
					baseUrl: cfg.baseUrl,
					apiKey: cfg.apiKey,
				});
			}
		</script>
	</body>
</html>
