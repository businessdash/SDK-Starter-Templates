<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Your Business — built on BD</title>
		<meta
			name="description"
			content="Vanilla JS starter showing how to consume the BD SDK through a same-origin Bun proxy."
		/>
		<link rel="stylesheet" href="/styles.css" />
	</head>
	<body>
		<!-- News banner (bundle.banner) mounts here. -->
		<div id="banner-root"></div>

		<!-- Sections are mounted by JS — see /main.js. Pure DOM
		     manipulation, no framework, no JSX. The same shape as the
		     React-Bun starter, just rendered with vanilla `document.createElement`. -->
		<header class="app-header">
			<div class="app-header__inner">
				<div class="app-header__brand">Your Business</div>
				<nav>
					<a href="#services">Services</a>
					<a href="#gallery">Gallery</a>
					<a href="/store">Store</a>
					<a href="/subscriptions">Plans</a>
					<a href="/reviews">Reviews</a>
					<a href="/updates">Updates</a>
					<a href="/todos">Todos</a>
					<a href="/cart">Cart</a>
					<a href="/my-account">Account</a>
				</nav>
			</div>
		</header>

		<main>
			<section class="hero" id="hero"></section>
			<section class="bd-section bd-section--narrow" id="about"></section>
			<section class="bd-section" id="services"></section>
			<section class="bd-section" id="gallery"></section>
			<section class="bd-section bd-section--narrow" id="booking"></section>
			<section class="bd-section" id="blog"></section>
			<section class="bd-section bd-section--narrow" id="contact"></section>
		</main>

		<footer class="app-footer">
			<div class="app-footer__copy">
				<div>© <span id="year"></span> Your Business. All rights reserved.</div>
				<div>
					Built with
					<a href="https://github.com/Gold240sx/business-in-a-box">@businessdash/sdk</a>
				</div>
			</div>
			<!-- Newsletter signup — same shared section as the About block.
			     Mounted by /main.js. -->
			<div class="subscribe subscribe--footer" id="footer-subscribe"></div>
		</footer>

		<script type="module" src="/main.js"></script>
		<script type="module">
			import { mountBanner } from "/banner.js";
			import { mountSetupBanner } from "/setup-banner.js";
			mountBanner(document.getElementById("banner-root"));
			mountSetupBanner();
		</script>
	</body>
</html>
