name: bd_starter
description: >-
  BD SDK — Flutter starter. The client lives in `packages/businessdash_sdk` as a PURE
  DART package so it can be analyzed and tested without a Flutter toolchain;
  this package is the Flutter app built on top of it.
publish_to: none
version: 0.1.0

environment:
  sdk: ^3.9.0

dependencies:
  businessdash_sdk:
    path: packages/businessdash_sdk
  # Native forms (the Form tab). The pickers and link opener below are
  # Flutter's own plugins; BdForm takes them as callbacks, so swap in any.
  businessdash_forms:
    path: packages/businessdash_forms

  flutter:
    sdk: flutter
  file_selector: ^1.1.0
  image_picker: ^1.2.4
  url_launcher: ^6.3.3
  flutter_web_auth_2: ^6.1.0
  # The cart's visitor id, the wishlist, compare picks and recently viewed,
  # kept on the device.
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  # MockClient, for the app's tests: a fake BD with no network.
  http: ^1.2.0
  lints: ^4.0.0

flutter:
  uses-material-design: true
