name: biab
description: >-
  BIAB Package API client. PURE DART — imports nothing from Flutter, so it
  analyzes, tests and runs anywhere Dart does, including a server or a CLI.
publish_to: none
version: 0.1.0

environment:
  sdk: ^3.6.0

dependencies:
  # The only runtime dependency. The BIAB Package API is plain REST with a
  # bearer key — there is nothing else to pull in.
  http: ^1.2.0

dev_dependencies:
  test: ^1.25.0
  lints: ^4.0.0
